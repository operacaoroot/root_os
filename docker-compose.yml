# Marketing OS — infra ISOLADA (stack próprio do projeto root)
# ⚠️ Ver docs/ISOLATION.md. NADA aqui compartilha rede/volume/porta com o escritório C&S.
name: marketing-os                     # isola containers, rede e volumes deste projeto

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mktos_db
    environment:
      POSTGRES_USER: ${DB_USER:-mkt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mkt}
      POSTGRES_DB: ${DB_NAME:-marketing_os}
    ports:
      - "${DB_PORT:-5442}:5432"        # faixa própria p/ não colidir com o escritório
    volumes:
      - mktos_db_data:/var/lib/postgresql/data
    networks: [marketing-os-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mkt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mktos_redis
    ports:
      - "${REDIS_PORT:-6390}:6379"
    volumes:
      - mktos_redis_data:/data
    networks: [marketing-os-net]

  minio:
    image: minio/minio
    container_name: mktos_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9010}:9000"     # API S3
      - "${MINIO_CONSOLE_PORT:-9011}:9001"  # console
    volumes:
      - mktos_minio_data:/data
    networks: [marketing-os-net]

  # --- Aplicações (imagem ÚNICA do monorepo; ver Dockerfile na raiz) ---
  # Segredos vêm do ambiente (deploy/up.sh injeta ~/.config/root/*.env + apps/api/.env).
  api:
    build: .
    image: mktos-app
    container_name: mktos_api
    working_dir: /app/apps/api
    command: sh -c "pnpm exec prisma migrate deploy && node dist/main.js"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-mkt}:${DB_PASSWORD:-mkt}@db:5432/${DB_NAME:-marketing_os}
      API_PORT: "4001"
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4000}
      # O container NÃO lê o .env: só chega o que estiver listado aqui. Variável
      # preenchida no .env e ausente deste bloco simplesmente não existe lá dentro.
      # A PORTA. `observar` classifica, registra e DEIXA PASSAR, logando o que
      # teria bloqueado. É assim que ela nasce: uma capacidade classificada
      # errado com a porta impondo faria a rotina diária parar em silêncio às 8
      # da manhã. Vira `impor` depois de ler uma semana de log.
      GATEWAY_MODO: ${GATEWAY_MODO:-observar}
      RASTRO_RETENCAO_DIAS: ${RASTRO_RETENCAO_DIAS:-1825}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-high}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-16000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # OpenRouter: mesma API de Chat Completions, com nome e custo próprios.
      # O custo vem de `usage.cost` do próprio provedor — medição, não estimativa.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      # Pauta: acervo, rotina e canais (ver docs/PAUTA.md)
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_TIMEOUT_SEC: ${APIFY_TIMEOUT_SEC:-120}
      PAUTA_CRON: ${PAUTA_CRON:-on}
      PAUTA_ESPELHO: ${PAUTA_ESPELHO:-off}
      PAUTA_ESPELHO_DIR: ${PAUTA_ESPELHO_DIR:-}
      PAUTA_DRIVE_FOLDER_ID: ${PAUTA_DRIVE_FOLDER_ID:-}
      EVOLUTION_URL: ${EVOLUTION_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCIA: ${EVOLUTION_INSTANCIA:-}
      EVOLUTION_GRUPO_JID: ${EVOLUTION_GRUPO_JID:-}
      CLICKUP_LIST_PAUTA: ${CLICKUP_LIST_PAUTA:-}
      CLICKUP_API_TOKEN: ${CLICKUP_API_TOKEN:-}
      CLICKUP_SPACE_ID: ${CLICKUP_SPACE_ID:-}
      CLICKUP_SPACE_NAME: ${CLICKUP_SPACE_NAME:-root}
      CLICKUP_IGNORE_TEAMS: ${CLICKUP_IGNORE_TEAMS:-Cardozo & Saggioro}
      CLICKUP_LIST_IDS: ${CLICKUP_LIST_IDS:-}
      CLICKUP_CONTENT_LIST_IDS: ${CLICKUP_CONTENT_LIST_IDS:-}
      CLICKUP_CONTENT_LIST_NAMES: ${CLICKUP_CONTENT_LIST_NAMES:-Gestão de Temas}
      CLICKUP_SYNC_INTERVAL_MIN: ${CLICKUP_SYNC_INTERVAL_MIN:-60}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OBSIDIAN_VAULT_PATH: /vault
      OBSIDIAN_REINDEX_MIN: ${OBSIDIAN_REINDEX_MIN:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/api/google/callback}
      # Login com o Gmail: quem pode entrar criando usuário na hora (vazio = ninguém novo)
      GOOGLE_LOGIN_ALLOWED_EMAILS: ${GOOGLE_LOGIN_ALLOWED_EMAILS:-}
      GOOGLE_LOGIN_REDIRECT_URI: ${GOOGLE_LOGIN_REDIRECT_URI:-}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_BASE_URL: ${PLUGGY_BASE_URL:-https://api.pluggy.ai}
      PLUGGY_SYNC_INTERVAL_MIN: ${PLUGGY_SYNC_INTERVAL_MIN:-360}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-}
      ASAAS_SYNC_INTERVAL_MIN: ${ASAAS_SYNC_INTERVAL_MIN:-360}
      FINANCE_APPROVAL_LIMIT: ${FINANCE_APPROVAL_LIMIT:-5000}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-http://localhost:4000/api/meta/callback}
      # Link na bio (absorvido do root-bio)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PUBLIC_BIO_ORIGIN: ${PUBLIC_BIO_ORIGIN:-https://bio.operacaoroot.com}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      BIO_SYNC_INTERVAL_MIN: ${BIO_SYNC_INTERVAL_MIN:-360}
      BIO_BRIDGE_INTERVAL_MIN: ${BIO_BRIDGE_INTERVAL_MIN:-720}
      # Storage do avatar. O endpoint é o nome do serviço na rede do compose —
      # o MinIO não é público (na VPS as portas ficam em 172.17.0.1) e quem
      # entrega a imagem ao browser é a própria API, em /api/bio/avatar/:arquivo.
      S3_ENDPOINT: ${S3_ENDPOINT:-minio}
      S3_PORT: ${S3_PORT:-9000}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-marketing-os}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
    volumes:
      # vault Obsidian do root montada READ-ONLY (base de conhecimento)
      - type: bind
        source: ${OBSIDIAN_VAULT_HOST:-/Users/rodrigosaggioro/Documents/Obsidian Vault}
        target: /vault
        read_only: true
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    ports:
      - "${API_PORT:-4001}:4001"
    networks: [marketing-os-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: mktos-app
    container_name: mktos_web
    working_dir: /app/apps/web
    command: pnpm start
    environment:
      API_PROXY_TARGET: http://api:4001
      # A página pública da bio é RSC: fala com a API por dentro da rede, sem
      # passar pelo rewrite /api (que existe para o browser).
      API_INTERNAL_URL: http://api:4001
      BIO_HOST: ${BIO_HOST:-bio.operacaoroot.com}
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-4000}:4000"
    networks: [marketing-os-net]
    restart: unless-stopped

  telegram:
    image: mktos-app
    container_name: mktos_telegram
    working_dir: /app/apps/telegram
    command: node dist/index.js
    environment:
      MCP_API_URL: http://api:4001/api
      MCP_ENTRY: /app/packages/mcp/dist/index.js
      MCP_SERVICE_EMAIL: ${MCP_SERVICE_EMAIL:-mcp@marketing-os.local}
      MCP_SERVICE_PASSWORD: ${MCP_SERVICE_PASSWORD:?defina no .env (sem default fraco) — rode db:seed p/ alinhar a conta}
      MCP_ACTION_EMAIL: ${MCP_ACTION_EMAIL:-ia-acao@marketing-os.local}
      MCP_ACTION_PASSWORD: ${MCP_ACTION_PASSWORD:?defina no .env (sem default fraco) — rode db:seed p/ alinhar a conta}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      DAILY_REPORT_TIME: ${DAILY_REPORT_TIME:-08:00}
      DAILY_REPORT_TZ: ${DAILY_REPORT_TZ:-America/Sao_Paulo}
    depends_on:
      api: { condition: service_healthy }
    networks: [marketing-os-net]
    restart: unless-stopped

networks:
  marketing-os-net:
    name: marketing-os-net             # rede dedicada e isolada

volumes:
  mktos_db_data:
  mktos_redis_data:
  mktos_minio_data:
