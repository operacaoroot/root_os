<!doctype html>
<!--
  O story da matéria (MC15): 1080×1920 no brand kit da ROOT, no mesmo padrão
  do thumb.html (MC11). Tokens COPIADOS do brand pack da marca (brand.json,
  render_tokens) — o render não lê aquele arquivo: P #9BDB1F, PL #C4FF2E,
  PD #1C3010, LB #DFFFE8, DB #070A08, ALERT #FF1F6B; texto em JetBrains Mono,
  chamada em Space Grotesk. Preenchido por lib/semana.mjs (`preencherStory`):
  todo marcador já vem escapado; FRAME é o arquivo do frame ao lado.
  As faixas de cima e de baixo ficam livres: o Instagram põe ali o avatar e a
  caixa de resposta.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Space+Grotesk:wght@500;600&display=block" rel="stylesheet">
<style>
  :root {
    --p: #9BDB1F;
    --pl: #C4FF2E;
    --pd: #1C3010;
    --lb: #DFFFE8;
    --db: #070A08;
    --alerta: #FF1F6B;
    --f-titulo: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    --f-apoio: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--db); }
  .quadro { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--db); }
  .grade {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(155,219,31,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155,219,31,0.07) 1px, transparent 1px);
    background-size: 54px 54px;
  }
  .brilho {
    position: absolute; right: -220px; top: 380px; width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(255,31,107,0.30), transparent 70%);
  }
  .topo {
    position: absolute; left: 72px; top: 250px; display: flex; gap: 20px; align-items: center;
    font-family: var(--f-titulo); font-weight: 800; font-size: 40px; letter-spacing: 1px;
  }
  .marca { background: var(--p); color: var(--db); padding: 8px 20px; }
  .ep { color: var(--pl); }
  .frame-caixa {
    position: absolute; left: 72px; top: 360px; width: 936px; height: 527px;
    border: 6px solid var(--p); background: var(--pd); overflow: hidden;
  }
  .frame { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.9) contrast(1.05); }
  .caixa-texto {
    position: absolute; left: 72px; top: 950px; width: 936px; height: 560px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .texto {
    font-family: var(--f-titulo); font-weight: 800; font-size: 76px; line-height: 1.08;
    letter-spacing: -2px; color: var(--p); overflow-wrap: anywhere;
  }
  .texto::after {
    content: ""; display: inline-block; width: 0.5em; height: 0.82em; margin-left: 0.12em;
    vertical-align: -0.06em; background: var(--pl);
  }
  .chamada {
    position: absolute; left: 72px; right: 72px; top: 1540px;
    font-family: var(--f-apoio); font-weight: 600; font-size: 46px; line-height: 1.2; color: var(--lb);
  }
  .chamada::before { content: "> "; font-family: var(--f-titulo); color: var(--alerta); }
</style>
</head>
<body>
  <div class="quadro">
    <div class="grade"></div>
    <div class="brilho"></div>
    <div class="topo"><span class="marca">ROOT</span><span class="ep">{{APELIDO}}</span></div>
    <div class="frame-caixa"><img class="frame" src="{{FRAME}}" alt=""></div>
    <div class="caixa-texto"><p class="texto" id="texto">{{TEXTO}}</p></div>
    <p class="chamada">{{CHAMADA}}</p>
  </div>
  <script>
    // Texto longo encolhe até caber na caixa; nunca abaixo de 44 px.
    (function () {
      var caixa = document.querySelector('.caixa-texto');
      var t = document.getElementById('texto');
      function caber() {
        var tam = 76;
        t.style.fontSize = tam + 'px';
        while ((t.scrollHeight > caixa.clientHeight || t.scrollWidth > caixa.clientWidth) && tam > 44) {
          tam -= 4;
          t.style.fontSize = tam + 'px';
        }
      }
      caber();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(caber);
    })();
  </script>
</body>
</html>
