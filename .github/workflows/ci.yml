      # 843, ~18% de folga sobre 1029, a mesma proporção de todas as ondas.
      #
      # ESTES NÚMEROS SÃO SÓ DA FATIA 4.3, e é de propósito — mesma disciplina
      # da fatia 3.5 na onda 6: o agente não afirma sobre suíte que não escreveu
