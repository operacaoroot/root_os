      # fatias da onda: `canal-de-aprovacao` (76), `documentacao` (48) e
      # `rebaixamento-por-erro` (20). `porta` foi de 35 para 39 (o teto de
      # momento do agente, imposto agora na porta: a recusa com causa própria no
      # rastro, R0 que passa, R3 que não, e o degrau EFETIVO em vez do de
      # catálogo), `arquitetura` de 38 para 40 (a quinta frente, que varre o
      # monorepo inteiro) e `resposta-sem-fonte` de 29 para 32 (a guarda
      # provisória saiu com os dois casos que a mediam; entraram a ferramenta
      # executada como fonte e os três casos do rebaixamento como sinal).
      #
      # O piso de ARQUIVOS vai a 32, colado no real — é ele quem pega arquivo que
      # some da coleta, e `publicar-peca` (4 casos) prova que nenhum piso de
      # CASOS com folga útil notaria a falta de um arquivo pequeno. O de CASOS
