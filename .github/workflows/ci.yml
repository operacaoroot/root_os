      # ---------------------------------------------------------------------
      # ONDA 9, ESTABILIZAÇÃO (11/09/2026): MEDIDO, 1000 casos em 28 arquivos
      # ---------------------------------------------------------------------
      # Mesmo regime: conjunto `padrao`, nenhum caso pulado, `TEST_DATABASE_URL`
