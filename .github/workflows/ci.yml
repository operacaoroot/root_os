      # depende da ordem e muda com qualquer campo; o loteItemId sai do
      # conteúdo; os enums espelhados e o efeito da capacidade do catálogo; a
      # frase da recusa. COM BANCO, 9 (a montagem recusa o que a
      # porta recusaria; o pedido vai à fila como R4, quem montou não assina e
      # a titular assina com senha e motivo e o efeito ativa; o efeito recusa a
      # assinatura de quem montou, o pedido antigo e o hash trocado; pedir de
      # novo mantém o hash; seis consumos simultâneos deixam passar UM; editar
      # uma peça derruba só o item dela; o teto por dia com a virada em SP e
      # corrida; o lote de outra empresa; o vencido). `porta` +12 com banco
      # (o item sai uma vez sem fila e o RASTRO leva o lote e o contador;
      # segundo uso; conteúdo diferente; fora da janela; vencido e revogado;
      # aguardando; outra empresa; outro recurso; loteItemId em capacidade
      # comum; vazio, com token e sem recurso; sem loteItemId vai à fila; porta
      # sem o serviço recusa). `validacao` +3, `arquitetura` +4 (o consumo e a
      # ativação têm dono), `modelos-globais` +1 (`ItemDoLote` no it.each dos
      # filhos), todos sem banco; `teto-custo-ia` ganhou a asserção da porta
      # sem o serviço de lotes no mesmo caso, e `conector-desligado` só
      # remediu a conta (64). Medido: 2854 casos em 69 arquivos com o banco;
      # sem ele, 2221 passados e 633 pulados (64 + 5 arquivos). O piso de
      # ARQUIVOS sobe 1, para 61; o de CASOS sobe 10 (~15% de folga sobre os 12
      # que rodam sem banco), para 2085.
      #
      # MD7, A REVISÃO (24/09/2026): +8 casos, todos COM BANCO. `lotes` +4 (lote
      # vencido não vai à fila; confirmada vencida não segura o lote; revogar o
      # último item encerra o lote; a falha ao encerrar não desfaz o uso) e o
      # caso do vencido passou a provar a empresa; `porta` +4 (item de outra
      # capacidade; lote abaixo do degrau efetivo; sob_lote sem lote no
      # catálogo; loteItemId forjado no contexto não chega ao efeito).
      # `arquitetura` ganhou a busca de SQL cru no caso que já existia. Medido:
      # 2862 casos em 69 arquivos com o banco; sem ele, os mesmos 2221 passados
      # e 641 pulados. Os pisos ficam onde estão: nada novo roda sem banco.
      #
      # MD8, APROVAR A SEMANA NUM PONTO SÓ (24/09/2026): +21 casos, +1 arquivo.
      # `pauta-lote-da-semana` (20, novo): sem banco, 11 — as pré-condições de
      # cada peça com a frase própria; o que para a semana inteira; o hash do
      # item muda com legenda, mídia, horário e conta; a janela e a validade;
      # a divergência; a linha do tempo; o corpo do "fica fora"; as permissões
      # das rotas; o link da fila no aviso do canal; o fuso (UTC gravado, SP
      # exibido). COM BANCO, 9 — as pré-condições barram sem gravar; a semana
      # vira um lote de 11, vai à fila como R4 e nada sai antes da assinatura;
      # a titular assina e as peças ficam aprovadas no slot com o episódio
      # Agendado; nota desligada não publica; editar depois de ativo revoga só
      # o item; o executor publica 10 no dublê da Graph, 3 por passagem, com
      # um consumo por item e o aprovador no RASTRO; "Cancelar a semana"; a
      # peça editada antes da assinatura cai na ativação; JPEG, horário e texto
      # revogam só o item. `root-midia` +1 (o `agenda` diz se a semana está
      # assinada ou na fila, e avisa a automática desligada), sem banco.
      # `pauta-publicacao-instagram` e `pauta-semana` mudaram casos, sem caso
      # novo. Medido: 2883 casos em 70 arquivos com o banco; sem ele, 2233
      # passados e 650 pulados (65 + 5 arquivos). O piso de ARQUIVOS sobe 1,
      # para 62; o de CASOS sobe 10 (~15% de folga sobre os 12 que rodam sem
      # banco), para 2095.
      #
      # MD8, correções da revisão: +6 casos em `pauta-lote-da-semana`, sem
      # arquivo novo. Sem banco, 3 — a segunda candidata do mesmo formato no
      # mesmo slot; o que a publicação anterior barra e o que a ativação
      # reabre; "ativo" só com a peça aprovada e fora do manual. COM BANCO, 3 —
      # o pedido vencido, a linha em erro, a que voltou ao manual e o "Publicar
      # agora" pedido na fila saem pelo lote, com as puladas fora do teto; a
      # rotina parada além do lote dá a peça por perdida e revoga o item; o
      # lote não assinado não tira a aprovada da agenda. Medido: 2889 casos em
      # 70 arquivos com o banco; sem ele, 2236 passados e 653 pulados. O piso
      # de CASOS sobe 2 (~15% de folga sobre os 3 sem banco), para 2097.
      #
      # MD9, A FILA DA DM À MÃO (25/09/2026): +37 casos, +1 arquivo.
      # `pauta-comentarios` (29, novo): sem banco, 11 — a palavra INTEIRA
      # ("AGENTES2" não é "AGENTES"); a triagem (própria conta pelo id e pelo @,
      # anúncio, resposta e a nota, 7 dias, sem autor, sem palavra); o texto da
      # DM com o /r/ e a página, sem caixa de entrada; os BYTES (600 "ç" não
      # passam); o texto editado sem o /r/ ou com slop; o HMAC da pessoa e a
      # chave curta; o permalink colado à mão e o perfil; a chave do link e o
      # resumo; a rotina e a capacidade no shared; as permissões; a variável no
      # compose e no .env.example. COM BANCO, 18 — o PRONTO QUANDO (três
      # comentários viram UMA linha com o @ e o /r/, paginação pelo cursor);
      # o RASTRO e o ToolCall sem @ nem id em claro NEM como sha256; a
      # reentrega na mesma linha; o post marcado à mão achado pelo permalink
      # (na segunda página das mídias, pelo cursor), com resposta e 8 dias fora
      # e a nota das respostas; respondido só com o HMAC e 409 na segunda; 7
      # dias apagam o @; o /r/ vira PixelEvent do link da DM, separado do botão
      # da página; a newsletter sem link; preparar e editar o texto; o
      # Instagram desligado sem chamada; fora da janela e com volume atípico,
      # R1 sem fila de aprovação; sem chave, sem escopo, sem peça; e os seis da
      # revisão — carrossel e corte da mesma matéria com o MESMO link (e o link
      # da rotina no RASTRO), a Graph que cai ao listar as mídias como erro e
      # uma chamada só, o módulo desligado que ainda apaga o @, o teto da fila
      # que nunca corta a pendente, o texto editado com /r/ morto que volta ao
      # padrão, e a corrida do texto da DM com o upload sob o cadeado.
      # `rastro-por-nivel` +1 (o `sigiloso` sem resumo não deixa hash nem
      # tamanho), `arquitetura` +3 (o cliente de comentários tem dono),
      # `escritas-pela-porta` +2, `modelos-globais` +1 (o filho novo no
      # it.each), `root-midia` +1 (a agenda conta os comentários sem @), todos
      # sem banco; `conector-desligado` só remediu a conta (65, 19 com
      # interruptor). Medido: 2926 casos em 71 arquivos com o banco; sem ele,
      # 2255 passados e 671 pulados (66 + 5 arquivos). O piso de ARQUIVOS sobe
      # 1, para 63; o de CASOS sobe 16 (~15% de folga sobre os 19 que rodam
      # sem banco), para 2113.
      #
      # MD10, O YOUTUBE PELA API (25/09/2026): +51 casos, +2 arquivos.
      # `youtube` (28, novo, sem banco): a auditoria que nasce pendente e falha
      # fechada; as faltas; os argumentos dos dois itens (título até 100
      # CARACTERES, descrição até 5.000 BYTES contados depois de trocar o
      # marcador, sem < >); as janelas; a conferência do vídeo; as variáveis no
      # compose e no .env.example; as permissões; o conector contra um dublê
      # HTTP (o state assinado conferido antes do banco, os dois escopos, o
      # refresh do cofre, a sessão SEMPRE privada, o update só com
      # part=status, o Testing na saúde); e o envio do Mac pelo protocolo
      # resumable (308 com Range, conexão caída no 3º bloco, 5xx, 404 de
      # sessão, o processo que morre e retoma, a resposta final perdida).
      # `pauta-youtube` (13, novo, COM BANCO): o PRONTO QUANDO com a porta, o
      # lote assinado pela titular e um YouTube de mentira — sem lote e com a
      # auditoria pendente o YouTube não recebe nada; a sessão pelo uso contado,
      # cifrada, reaproveitada sem gastar uso (e recusada ao pacote mudado),
      # e o token no RASTRO sem o valor;
      # o YouTube desligado; o "concluído" que confere e define a thumb; o
      # modo teste e a nota desligada que pulam; o pacote mudado que não agenda;
      # e o publishAt uma vez só, com os itens encerrados depois.
      # `arquitetura` +5 (o YouTube tem o desenho do publicador),
      # `escritas-pela-porta` +2, `modulos-por-tenant` +1, `modelos-globais` +1
      # (o filho novo no it.each), `root-midia` +1 (as rotas do YouTube no
      # cliente do OS), todos sem banco; `conector-desligado` só remediu a
      # conta (67, 21 com interruptor). Medido: 2977 casos em 73 arquivos com o
      # banco; sem ele, 2293 passados e 684 pulados (67 + 6 arquivos). O piso de
      # ARQUIVOS sobe 2, para 65; o de CASOS sobe 32 (~15% de folga sobre os
      # 38 que rodam sem banco), para 2145.
      #
      # MD10, a correção dos três revisores (25/09/2026): +13 casos, 0 arquivo.
      # `youtube` +10 (sem banco): o `uploadStatus` recusado, o canal de teste,
      # a playlist sem entrada repetida, o token do Mac pedido só com
      # `youtube.upload` e guardado à parte, o canal da conexão, o Testing
      # lembrado pela data da conexão, o `conector.autorizar` no RASTRO e o
      # 401 do Mac — uma vez, o mesmo token de volta e o que persiste, os dois
      # que terminam). `pauta-youtube` +3 (COM BANCO): o token largo e o canal
      # de teste recusados antes da porta, a janela do envio fechada com o
      # lote de pé, e o modo teste do começo ao fim (e mais de 20 envios
      # parados no caso da rotina). Medido: 2990 casos em 73 arquivos com o
      # banco; sem ele, 2303 passados e 687 pulados. O piso de CASOS sobe 8
      # (~15% de folga sobre os 10 que rodam sem banco), para 2153.
      PISO_CASOS_API: '2153'
      PISO_ARQUIVOS_API: '65'

    steps:
      - uses: actions/checkout@v4

      # Sem `version:`: a versão sai do campo `packageManager` da raiz.
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar o client do Prisma
        run: pnpm --filter @mktos/api db:generate

      # tsup rápido. `apps/api` e `apps/web` importam @mktos/policy e
      # @mktos/shared pelo `exports` do package.json, que aponta para dist/ —
      # sem este passo, chamar as suítes por filtro direto quebra no import.
      - name: Compilar os pacotes internos
        run: pnpm --filter @mktos/shared --filter @mktos/policy build

      - name: A variável de banco de teste precisa existir
        run: |
          test -n "$TEST_DATABASE_URL" || {
            echo "::error::TEST_DATABASE_URL vazia — porta.test e runtime.test se pulariam inteiros e a CI passaria sem testar a porta"
            exit 1
          }

      - name: Aplicar as migrations no banco da CI
        run: pnpm --filter @mktos/api db:deploy

      # A régua como DADO. O seed é idempotente e recusa rebaixar nível; se o
      # catálogo divergir do classificador ele sai com código 1 e reprova aqui,
      # que é exatamente onde essa divergência tem que aparecer.
      - name: Semear a política
        run: pnpm --filter @mktos/api db:seed:politica

      - name: Typecheck do monorepo
        run: pnpm typecheck

      # `apps/api/test/` mora FORA do tsconfig de build de propósito (um .ts
      # fora de src/ desloca a saída para dist/src/ e o Dockerfile não acha
      # dist/main.js). Este é o tsconfig que cobre os tipos dos testes.
      - name: Typecheck das suítes da api
        run: pnpm --filter @mktos/api typecheck:test

      # A trava de cobertura, escrita fora do repositório: é infraestrutura de
      # CI, não código de produto. Um único script serve as três suítes.
      - name: Preparar a trava de cobertura
        run: |
          cat > "$RUNNER_TEMP/conferir-suite.mjs" <<'MJS'
          // Lê o resumo em JSON de uma suíte do vitest e afirma sobre NÚMEROS.
          // Fail-closed: qualquer dúvida — resumo ausente, vazio, ilegível,
          // campo que sumiu — reprova. Esta trava existe justamente para impedir
          // CI verde sem ter testado nada; falhar para verde seria a direção
          // errada.
          import { readFileSync } from 'node:fs';

          const [caminho, pisoCasosArg, pisoArquivosArg, ...rotuloPartes] = process.argv.slice(2);
          const rotulo = rotuloPartes.join(' ') || caminho || 'suíte';

          function reprovar(mensagem, detalhe) {
            console.log('::error title=Cobertura da suíte ' + rotulo + '::' + mensagem);
            if (detalhe) console.log(detalhe);
            process.exit(1);
          }

          if (!caminho || !pisoCasosArg || !pisoArquivosArg) {
            reprovar('uso: conferir-suite.mjs <resumo.json> <piso de casos> <piso de arquivos> [rótulo]');
          }

          const pisoCasos = Number(pisoCasosArg);
          const pisoArquivos = Number(pisoArquivosArg);
          if (!Number.isInteger(pisoCasos) || !Number.isInteger(pisoArquivos)) {
            reprovar('os pisos precisam ser inteiros; vieram "' + pisoCasosArg + '" e "' + pisoArquivosArg + '"');
          }

          let bruto = '';
          try {
            bruto = readFileSync(caminho, 'utf8');
          } catch (erro) {
            reprovar(
              'o resumo ' + caminho + ' não foi escrito. Sem resumo não dá para afirmar que a suíte rodou, então a trava reprova em vez de supor. Confira se o comando de teste ainda passa --reporter=json e --outputFile.json.',
              String(erro && erro.message),
            );
          }
          if (!bruto.trim()) {
            reprovar('o resumo ' + caminho + ' veio vazio — a suíte provavelmente nem chegou a rodar.');
          }

          let resumo;
          try {
            resumo = JSON.parse(bruto);
          } catch (erro) {
            reprovar(
              'o resumo ' + caminho + ' não é JSON válido — o formato do relatório mudou e a trava não consegue mais afirmar nada.',
              String(erro && erro.message),
            );
          }

          function numero(campo) {
            const valor = resumo[campo];
            if (typeof valor !== 'number' || !Number.isFinite(valor)) {
              reprovar('o resumo não traz o campo numérico "' + campo + '". O formato do relatório do vitest mudou: conserte esta trava antes de seguir, porque sem ela a CI volta a poder passar sem testar nada.');
            }
            return valor;
          }

          const total = numero('numTotalTests');
          const passaram = numero('numPassedTests');
          const falharam = numero('numFailedTests');
          const pulados = numero('numPendingTests');
          const aFazer = numero('numTodoTests');

          if (!Array.isArray(resumo.testResults)) {
            reprovar('o resumo não traz a lista de arquivos (testResults).');
          }
          const arquivos = resumo.testResults;

          const porStatus = {};
          for (const arquivo of arquivos) {
            for (const caso of arquivo.assertionResults || []) {
              porStatus[caso.status] = (porStatus[caso.status] || 0) + 1;
            }
          }
          const naoPassaram = Object.entries(porStatus).filter(([nome]) => nome !== 'passed');

          console.log(
            'Suíte ' + rotulo + ': ' + total + ' casos em ' + arquivos.length +
            ' arquivos (piso: ' + pisoCasos + ' casos, ' + pisoArquivos + ' arquivos).',
          );
          console.log('  passaram=' + passaram + ' falharam=' + falharam + ' pulados=' + pulados + ' a_fazer=' + aFazer);
          for (const arquivo of arquivos) {
            const casos = (arquivo.assertionResults || []).length;
            console.log('  - ' + String(arquivo.name || '(sem nome)').split('/').slice(-2).join('/') + ' (' + casos + ')');
          }

          if (resumo.success !== true) {
            reprovar('o vitest reportou a execução como malsucedida.');
          }
          if (falharam > 0) {
            reprovar(falharam + ' caso(s) falharam.');
          }
          if (pulados > 0 || aFazer > 0) {
            reprovar(
              (pulados + aFazer) + ' caso(s) foram PULADOS. Quase sempre é TEST_DATABASE_URL não chegando em porta.test/runtime.test, que se pulam inteiros — a CI estaria verde sem ter testado a porta. Também pega it.skip esquecido num PR.',
            );
          }
          if (naoPassaram.length > 0) {
            reprovar('há casos com status diferente de "passed": ' + naoPassaram.map(([nome, n]) => nome + '=' + n).join(', '));
          }
          if (total < pisoCasos) {
            reprovar(
              'só ' + total + ' casos rodaram, abaixo do piso de ' + pisoCasos + '. "Ninguém marcou skip" não é o mesmo que "os testes que importam rodaram": arquivo que deixa de ser coletado não aparece como pulado, some. Se a queda for legítima, baixe o piso no próprio workflow, de propósito e por escrito.',
            );
          }
          if (arquivos.length < pisoArquivos) {
            reprovar('só ' + arquivos.length + ' arquivos de teste rodaram, abaixo do piso de ' + pisoArquivos + '.');
          }

          console.log('Suíte ' + rotulo + ': íntegra — nada pulado, nada pendente, acima do piso.');
          MJS
          # Fail-closed também aqui: heredoc mal recortado não pode virar uma
          # trava que "passa" por não conseguir rodar.
          test -s "$RUNNER_TEMP/conferir-suite.mjs" || {
            echo "::error::a trava de cobertura não foi escrita"
            exit 1
          }
          node --check "$RUNNER_TEMP/conferir-suite.mjs"

      # Os três `--reporter=json --outputFile.json` existem para a trava. O
      # `--reporter=default` continua imprimindo o log legível para gente.
      #
      # O `--` ANTES dos argumentos não é enfeite: sem ele o pnpm 9 tenta ler
      # `--outputFile.json` como opção SUA e morre com "Unknown option:
      # 'outputFile.json'" antes de chamar o vitest. O passo falhava, a trava
      # nunca era alcançada e os pisos abaixo não guardavam nada. Medido no
      # pnpm 9.15.9, que é o do `packageManager` da raiz.
      - name: Testes de policy
        run: |
          pnpm --filter @mktos/policy test -- \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/resumo-policy.json"

      - name: A suíte de policy rodou inteira
        run: |
          node "$RUNNER_TEMP/conferir-suite.mjs" "$RUNNER_TEMP/resumo-policy.json" \
            "$PISO_CASOS_POLICY" "$PISO_ARQUIVOS_POLICY" policy

      - name: Testes de web
        run: |
          pnpm --filter @mktos/web test -- \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/resumo-web.json"

      - name: A suíte de web rodou inteira
        run: |
          node "$RUNNER_TEMP/conferir-suite.mjs" "$RUNNER_TEMP/resumo-web.json" \
            "$PISO_CASOS_WEB" "$PISO_ARQUIVOS_WEB" web

      - name: Testes de api
        run: |
          pnpm --filter @mktos/api test -- \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/resumo-api.json"

      - name: A suíte de api rodou inteira
        run: |
          node "$RUNNER_TEMP/conferir-suite.mjs" "$RUNNER_TEMP/resumo-api.json" \
            "$PISO_CASOS_API" "$PISO_ARQUIVOS_API" api

  # ---------------------------------------------------------------------------
  # 2. Isolamento entre tenants — job próprio, fora do `pnpm test`.
  # ---------------------------------------------------------------------------
  #
  # `tenant-isolation.test.ts` LANÇA no import quando falta TEST_DATABASE_URL
  # (não se pula sozinho), escreve nas duas orgs que semeia, e mede o
  # isolamento NO BANCO — não na aplicação. Ela era o critério de aceite da
  # ativação de RLS, e por isso saía VERMELHA de propósito enquanto nenhuma
  # tabela tivesse policy.
  #
  # ISSO ACABOU NA FATIA 1.5. A migration `20260911050000_isolamento_por_linha`
  # liga `ROW LEVEL SECURITY` com `FORCE` nas 72 tabelas do schema e escreve as
  # policies de cada uma; a suíte passa inteira (medido: 257 casos verdes contra
  # o Postgres descartável, 11/09/2026, com o papel restrito fazendo as
  # leituras). O `continue-on-error` que este passo carregava foi APAGADO no
  # mesmo commit — enquanto ele existia, vazamento entre empresas rodava na CI e
  # não reprovava nada, que é a aparência da prova sem a prova.
  #
  # Falta a metade que não mora neste arquivo: marcar "Isolamento entre tenants"
  # como verificação obrigatória na proteção de branch da `main`. Sem isso o job
  # reprova e o merge continua liberado (ver o cabeçalho).
  isolamento:
    name: Isolamento entre tenants
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mkt
          POSTGRES_PASSWORD: mkt
          POSTGRES_DB: marketing_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mkt -d marketing_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://mkt:mkt@localhost:5432/marketing_os_test
      # Conexão ADMIN: semeia e limpa. O nome do banco precisa parecer de teste.
      TEST_DATABASE_URL: postgresql://mkt:mkt@localhost:5432/marketing_os_test
      # Conexão da APLICAÇÃO: role restrita, sujeita a RLS. Sem ela a suíte cai
      # na admin e avisa que o resultado não vale nada — dono de tabela ignora
      # policy em silêncio, a menos que a tabela esteja com FORCE.
      TENANT_DATABASE_URL: postgresql://mktos_app:ci@localhost:5432/marketing_os_test
      TENANT_GUC: app.org_id

    steps:
      - uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # As suítes importam PrismaClient, PERMISSIONS e a política diretamente.
      # Em checkout limpo, os pacotes internos apontam para dist/ e esses
      # diretórios ainda não existem; sem estes passos o job morre na coleta
      # antes de medir RLS e o cofre.
      - name: Gerar o client do Prisma
        run: pnpm --filter @mktos/api db:generate

      - name: Compilar os pacotes internos
        run: pnpm --filter @mktos/shared --filter @mktos/policy build

      - name: Aplicar as migrations no banco da CI
        run: pnpm --filter @mktos/api db:deploy

      # O cofre atravessa a porta de ferramentas e grava PolicyDecision. A
      # capacidade precisa existir no banco para a chave estrangeira provar o
      # mesmo caminho usado em produção.
      - name: Semear a política
        run: pnpm --filter @mktos/api db:seed:politica

      # ---------------------------------------------------------------------
      # O papel de aplicação é CRIADO PELA MIGRATION, não aqui.
      #
      # Aqui ele só ganha a senha descartável deste runner. A distinção não é
      # estética — este passo já foi um `CREATE ROLE ... IF NOT EXISTS` seguido
      # de GRANTs, e nessa forma quebrava a suíte de duas maneiras ao mesmo
      # tempo, as duas em silêncio (medido em Postgres limpo, 10/09/2026):
      #
      #  1. A migration 20260911020000_papel_de_aplicacao cria o papel NOLOGIN
      #     de propósito (senha é segredo de operação, não entra no repositório).
      #     Com o papel já existindo, o `IF NOT EXISTS` não fazia nada e ele
      #     seguia sem poder conectar: `TENANT_DATABASE_URL` dava "password
      #     authentication failed", o `beforeAll` da suíte morria e o vitest
      #     reportava 211 PULADOS e ZERO executados — contra 194 casos rodando
      #     antes desta fatia. Naquela época o passo da suíte ainda tinha
      #     `continue-on-error` e o job terminava VERDE sem ter medido nada; hoje
      #     ele reprova, mas o piso de casos continua sendo o que separa "passou"
      #     de "não rodou".
      #
      #  2. `GRANT ... ON ALL TABLES IN SCHEMA public` inclui "EventLog" e
      #     "_prisma_migrations", e DESFAZIA os dois REVOKE que a migration tinha
      #     acabado de aplicar. Medido depois do passo: o papel voltava a poder
      #     UPDATE/DELETE no RASTRO e a ler o histórico de migration.
      #
      # Por isso não há GRANT nenhum abaixo: a migration já concede exatamente o
      # necessário, e qualquer concessão repetida aqui só tem como divergir dela.
      # O bloco de conferência é fail-closed — se um dia alguém reintroduzir um
      # GRANT amplo, este passo (que NÃO tem continue-on-error) reprova o job,
      # em vez de deixar a suíte medir um papel que já não é o de produção.
      # ---------------------------------------------------------------------
      - name: Dar senha ao papel de aplicação criado pela migration
        env:
          PGPASSWORD: mkt
        run: |
          psql -h localhost -U mkt -d marketing_os_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mktos_app') THEN
              RAISE EXCEPTION
                'o papel mktos_app não existe depois de prisma migrate deploy. A migration 20260911020000_papel_de_aplicacao AVISA e segue quando o usuário não tem SUPERUSER nem CREATEROLE — leia o log do passo anterior. Sem este papel a suíte leria como DONA das tabelas, e dono ignora policy de linha: o resultado não valeria nada.';
            END IF;
          END
          $$;

          -- Só a senha. Nem atributo de papel (a migration já fixou
          -- NOBYPASSRLS/NOSUPERUSER), nem permissão.
          ALTER ROLE mktos_app WITH LOGIN PASSWORD 'ci';

          DO $$
          DECLARE
            estragos text[] := '{}';
          BEGIN
            IF has_table_privilege('mktos_app', '"EventLog"', 'UPDATE')   THEN estragos := array_append(estragos, 'UPDATE no EventLog'); END IF;
            IF has_table_privilege('mktos_app', '"EventLog"', 'DELETE')   THEN estragos := array_append(estragos, 'DELETE no EventLog'); END IF;
            IF has_table_privilege('mktos_app', '"EventLog"', 'TRUNCATE') THEN estragos := array_append(estragos, 'TRUNCATE no EventLog'); END IF;
            IF has_table_privilege('mktos_app', '_prisma_migrations', 'SELECT') THEN estragos := array_append(estragos, 'SELECT em _prisma_migrations'); END IF;
            IF has_schema_privilege('mktos_app', 'public', 'CREATE')      THEN estragos := array_append(estragos, 'CREATE no schema public'); END IF;
            IF array_length(estragos, 1) IS NOT NULL THEN
              RAISE EXCEPTION
                'o papel mktos_app tem permissão a mais depois da preparação: %. A migration revoga isso; alguma concessão manual (quase sempre um GRANT ... ON ALL TABLES) desfez o revoke, e a suíte passaria a medir um papel mais poderoso que o de produção.',
                array_to_string(estragos, ', ');
            END IF;
          END
          $$;

          SELECT rolname, rolcanlogin AS entra, rolbypassrls AS atravessa_rls, rolsuper AS superusuario
            FROM pg_roles WHERE rolname = 'mktos_app';
          SQL

      # SEM `continue-on-error`. Apagado na fatia 1.5, no commit que ligou o
      # isolamento por linha. Vermelho aqui é vazamento entre empresas.
      #
      # O piso de casos existe pelo mesmo motivo do das outras suítes, e aqui ele
      # é ainda mais necessário: este arquivo é o ÚNICO do conjunto `isolamento`
      # do vitest, e uma troca de `MKTOS_CONJUNTO_DE_TESTES`, um glob que deixa
      # de casar ou um `describe` que some fariam o vitest sair VERDE tendo
      # coletado zero. "Nenhum teste falhou" é verdade sobre nenhum teste.
      #
      # 257 era a contagem da fatia 1.5. A ESTABILIZAÇÃO DA ONDA 6 remediu em
      # 11/09/2026, com o papel restrito de pé: **265 casos** — as três tabelas
      # novas da onda (`RastroRetencao`, `TetoDeCustoIa`/`GastoDeIaNoDia`,
      # `ConectorDesligado`) entraram no registro de alvos e cada uma trouxe a
      # sua medição. O piso sobe de 220 para 225, que continua ~15% abaixo do
      # real: piso é chão, não espelho. Ao remover caso de propósito, baixe o
      # piso no mesmo commit.
      #
      # ONDA 7 (11/09/2026): **267 casos**, remedidos no mesmo regime. A tabela
      # `SegredoDeConector` — a do COFRE, que nasce com RLS/FORCE e as duas
      # policies na mesma migration que a cria — entrou no registro de alvos e
      # trouxe os 2 casos de medição dela. O piso vai de 225 para 227, mantendo
      # os ~15% de folga.
      #
      # O piso SUBIU de 190 para 220 na correção da fatia 1.5, e o motivo é a
      # coisa que o piso existe para pegar. A contagem era 224 com o registro de
      # alvos escrito à mão em 59 entradas, para um banco com 69 tabelas de
      # empresa: dez tabelas — agentes, aprovação, RASTRO, sessões, passos,
      # procedimentos, decisões de política e identidade de canal — não tinham
      # semente e por isso não tinham prova. Uma policy `USING (true)` em três
      # delas manteve a suíte 224/224 VERDE. Agora o registro é cobrado contra o
      # catálogo do banco e as dez entraram, o que soma ~30 casos de medição.
      # Um piso de 190 continuaria absolvendo o retorno daquele estado.
      #
      # A FORMA DO COMANDO NÃO É INDIFERENTE — medido em 11/09/2026, pnpm 9.15.9.
      # Duas variantes rodam a suíte, saem verdes e NÃO escrevem o resumo:
      #   pnpm --filter @mktos/api test:isolamento -- --outputFile.json=X
      #   pnpm --filter @mktos/api exec vitest run -- --outputFile.json=X
      # A primeira porque o `--` de `pnpm run` não chega ao vitest quando o
      # script tem prefixo de variável de ambiente (`VAR=x vitest run`); a
      # segunda porque `pnpm exec` repassa o `--` literalmente e o vitest trata o
      # que vem depois como FILTRO de arquivo, não como opção. Nos dois casos o
      # arquivo não existe e a conferência abaixo reprova por "resumo ilegível" —
      # ruidoso, mas pelo motivo errado.
      # A forma abaixo (exec, sem `--`) escreve. O interruptor do conjunto vem
      # pelo ambiente do passo, que é o mesmo que o script `test:isolamento` faz.
      - name: Suíte de isolamento
        env:
          MKTOS_CONJUNTO_DE_TESTES: isolamento
          RESUMO_ISOLAMENTO: ${{ runner.temp }}/resumo-isolamento.json
          # ONDA 9 (11/09/2026): **277 casos**, remedidos no mesmo regime, com o
          # papel restrito de pé e uma senha só para o cluster inteiro (ela foi
          # trocada três vezes durante a onda, por três agentes diferentes — e
          # papel é do cluster, então a última troca valia para todos e as outras
          # duas suítes ficavam sem entrar). As cinco tabelas novas da memória e
          # das rotinas entraram no registro de alvos: 78 tabelas de empresa,
          # todas com RLS e FORCE. O piso vai de 227 para 235, mantendo os ~15%.
          #
          # ONDA 11 (12/09/2026): **287 casos**, mesmo regime. `Assinatura` e
          # `CobrancaDeAssinatura` entraram no registro de alvos — e entraram
          # porque a catraca do catálogo as PEGOU: a fatia 6.2 criou as duas
          # tabelas com policy e sem semente, e sem semente o caso "A não lê
          # linha de B" roda contra tabela vazia e passa com qualquer policy.
          # São 83 tabelas de empresa no registro e 86 com RLS e FORCE no
          # banco. O piso vai de 235 para 243, mantendo os ~15%.
          #
          # ESTEIRA DE CLIENTES (17/09/2026): **293 casos**. `WorkApontamento`
          # (horas por cliente e por etapa) entrou no registro de alvos e em
          # `FILHOS_COM_ORGID_REDUNDANTE`: +6 casos. O piso sobe 5, para 248.
          #
          # MC7, O EPISÓDIO (23/09/2026): **326 casos** (319 medidos antes da
          # fatia, com o onboarding). `PautaEpisodio` entrou no registro de
          # alvos e em `FILHOS_COM_ORGID_REDUNDANTE` com DOIS pais conferidos
          # (a rodada e a página de links): +7 casos. O piso sobe 6, para 254.
          #
          # MD6, O PUBLICADOR DO INSTAGRAM (24/09/2026): **332 casos**.
          # `PautaPublicacao` entrou no registro de alvos e em
          # `FILHOS_COM_ORGID_REDUNDANTE`: +6 casos. O piso sobe 5, para 259.
          #
          # MD7, A APROVAÇÃO DE LOTE (24/09/2026): **340 casos**.
          # `AprovacaoDeLote` (empresa própria) e `ItemDoLote` (filho do lote,
          # em `FILHOS_COM_ORGID_REDUNDANTE`) entraram no registro de alvos:
          # +8 casos. O piso sobe 7, para 266.
          #
          # MD9, A FILA DA DM À MÃO (25/09/2026): **346 casos**.
          # `ComentarioComPalavra` (filha da peça, em
          # `FILHOS_COM_ORGID_REDUNDANTE`) entrou no registro de alvos: +6
          # casos. O piso sobe 5, para 271.
          #
          # MD10, O YOUTUBE PELA API (25/09/2026): **352 casos**.
          # `EnvioAoYoutube` (filha do episódio, em
          # `FILHOS_COM_ORGID_REDUNDANTE`) entrou no registro de alvos: +6
          # casos. O piso sobe 5, para 276.
          PISO_CASOS_ISOLAMENTO: '276'
        run: |
          pnpm --filter @mktos/api exec vitest run \
            --reporter=default --reporter=json \
            --outputFile.json="$RESUMO_ISOLAMENTO"
          node -e '
            const fs = require("node:fs");
            let r;
            try { r = JSON.parse(fs.readFileSync(process.env.RESUMO_ISOLAMENTO, "utf8")); }
            catch (e) { console.log("::error::resumo da suite de isolamento ilegivel: " + e.message); process.exit(1); }
            const piso = Number(process.env.PISO_CASOS_ISOLAMENTO);
            const total = r.numTotalTests;
            console.log("tenant-isolation: " + total + " casos, " + r.numPassedTests + " verdes, " +
              r.numFailedTests + " vermelhos, " + r.numPendingTests + " pulados (piso: " + piso + ").");
            if (r.success !== true || r.numFailedTests > 0 || r.numPendingTests > 0) {
              console.log("::error::a suite de isolamento nao passou inteira.");
              process.exit(1);
            }
            if (!Number.isInteger(piso) || total < piso) {
              console.log("::error::so " + total + " casos rodaram, abaixo do piso de " + piso +
                ". O conjunto de arquivos do vitest nao e o de isolamento — confira MKTOS_CONJUNTO_DE_TESTES " +
                "e o include de apps/api/vitest.config.ts.");
              process.exit(1);
            }
          '
          {
            echo "Isolamento entre tenants: VERDE."
            echo ""
            echo "A suíte mede o isolamento NO BANCO, com o papel restrito \`mktos_app\` fazendo as leituras. Se este job não estiver marcado como verificação obrigatória na proteção de branch da \`main\`, ele reprova e o merge continua liberado."
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # A SEÇÃO DE RLS DAS ROTAS PÚBLICAS — mora aqui, e não no job `qualidade`.
      #
      # `test/rotas-publicas-tenant.test.ts` tem um bloco final que LIGA
      # `ROW LEVEL SECURITY` de verdade nas tabelas que as rotas públicas tocam,
      # cria as policies que a fatia 1.5 vai escrever, roda as rotas e confere
      # que sob a sentinela da resolução pública NÃO SE ESCREVE. Ele é o único
      # lugar onde esse furo (uma policy `FOR ALL` sem `WITH CHECK`) é medido em
      # vez de descrito.
      #
      # Não pode rodar no job 1 por um motivo de banco, não de gosto: `ENABLE
      # ROW LEVEL SECURITY` vale para o BANCO inteiro, e o vitest roda os
      # arquivos em paralelo contra o mesmo Postgres — ligado lá, ele derrubaria
      # `porta.test.ts` e `contexto-aprovacao.test.ts`. Por isso o arquivo só
      # registra a seção quando `RLS_NO_TESTE=1`, e aqui ela roda SOZINHA, num
      # processo do vitest só dela.
      #
      # Este job é o lugar certo porque só ele tem o papel restrito com senha
      # (`TENANT_DATABASE_URL`): sem ele a seção mede o DONO das tabelas, e dono
      # ignora policy de linha.
      #
      # Vermelho aqui é regressão, nunca dívida conhecida (medido: 53 casos
      # verdes). O passo roda DEPOIS da suíte de isolamento, e a ordem continua
      # sendo a barata: enquanto ele roda, o `desligar()` do `beforeAll` daquele
      # arquivo DESLIGA a RLS das 11 tabelas que ele governa (ele cria policies
      # próprias, com outro nome, para provar a fatia 1.4), e uma quebra no meio
      # do arquivo deixa o banco assim.
      #
      # No caminho feliz isso deixou de vazar para as outras suítes: o `afterAll`
      # daquele arquivo religa o isolamento da migration com `app_rls_ligar()`
      # (11/09/2026). Antes disso ele terminava o banco em 61 de 72 tabelas, e
      # quem consertava era a auto-cura da suíte de isolamento — que na CI
      # funcionava e num banco de desenvolvimento não existia.
      # -----------------------------------------------------------------------
      - name: Rotas públicas com o isolamento por linha LIGADO
        env:
          RLS_NO_TESTE: '1'
          RESUMO_RLS: ${{ runner.temp }}/resumo-rls.json
          # 53 = 38 casos de sempre + 15 da seção de RLS. Piso, não espelho.
          PISO_CASOS_RLS: '50'
        run: |
          # SEM `--` antes das opções. Com ele, `pnpm exec` repassa o `--`
          # literalmente e o vitest trata `--reporter=...` como FILTRO de
          # arquivo: a suíte roda, sai verde, e o resumo NUNCA é escrito — a
          # conferência logo abaixo então reprova com "resumo ilegível", que
          # esconde a causa. Medido em 11/09/2026 (pnpm 9.15.9, vitest 3.2.7);
          # o `--` estava aqui desde que este passo nasceu.
          pnpm --filter @mktos/api exec vitest run test/rotas-publicas-tenant.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$RESUMO_RLS"
          # Fail-closed: se a seção não for registrada (interruptor perdido,
          # TENANT_DATABASE_URL vazia), o arquivo roda só os 38 casos de sempre
          # e passaria VERDE sem ter medido RLS nenhum. O piso é o que impede.
          node -e '
            const fs = require("node:fs");
            let r;
            try { r = JSON.parse(fs.readFileSync(process.env.RESUMO_RLS, "utf8")); }
            catch (e) { console.log("::error::resumo da secao de RLS ilegivel: " + e.message); process.exit(1); }
            const piso = Number(process.env.PISO_CASOS_RLS);
            const total = r.numTotalTests;
            console.log("rotas-publicas-tenant com RLS: " + total + " casos, " +
              r.numPassedTests + " verdes, " + r.numFailedTests + " vermelhos, " +
              r.numPendingTests + " pulados (piso: " + piso + ").");
            if (r.success !== true || r.numFailedTests > 0 || r.numPendingTests > 0) {
              console.log("::error::a secao de RLS das rotas publicas nao passou inteira.");
              process.exit(1);
            }
            if (!Number.isInteger(piso) || total < piso) {
              console.log("::error::so " + total + " casos rodaram, abaixo do piso de " + piso +
                " (esperados 53: 38 sem RLS + 15 com). A secao de RLS nao foi registrada — quase sempre " +
                "RLS_NO_TESTE ou TENANT_DATABASE_URL que nao chegou. Ela NAO aparece como pulada, porque o " +
                "arquivo a registra por if e nao por describe.skipIf; este piso e o que a impede de sumir em silencio.");
              process.exit(1);
            }
          '

      # -----------------------------------------------------------------------
      # A SEÇÃO DE ISOLAMENTO DO COFRE — onda 7, fatia 5.3.
      #
      # `test/cofre.test.ts` termina com um bloco que mede, com o PAPEL RESTRITO,
      # se uma empresa alcança o segredo de outra em `SegredoDeConector`. É a
      # tabela de CREDENCIAIS: se alguma coisa neste repositório precisa de prova
      # de isolamento medida em vez de descrita, é ela.
      #
      # O gatilho é o MESMO de `rotas-publicas-tenant`, e de propósito:
      # `RLS_NO_TESTE=1` mais `TENANT_DATABASE_URL`. A seção liga RLS no banco
      # inteiro e por isso não pode rodar no job `qualidade`, onde os arquivos
      # rodam em paralelo contra o mesmo Postgres — e é este job o único que tem
      # o papel restrito com senha. Sem o passo abaixo ela NUNCA rodaria em lugar
      # nenhum: o arquivo a registra por `if` e não por `describe.skipIf`, então
      # ela não apareceria nem como pulada.
      #
      # Medido em 11/09/2026, contra o Postgres descartável com `mktos_app` de
      # pé: **97 casos** (89 sem a seção + 8 dela).
      # -----------------------------------------------------------------------
      - name: Cofre com o isolamento por linha LIGADO
        env:
          RLS_NO_TESTE: '1'
          RESUMO_COFRE: ${{ runner.temp }}/resumo-cofre.json
          # 94 = acima dos 89 que o arquivo roda SEM a seção, e abaixo dos 97
          # reais. A margem é estreita porque a seção é pequena (8 casos): o
          # piso precisa caber entre os dois números para reprovar quando a
          # seção não for registrada. Ao acrescentar caso fora da seção, suba
          # este piso junto, senão ele para de distinguir as duas situações.
          PISO_CASOS_COFRE: '94'
        run: |
          # SEM `--` antes das opções — mesma armadilha do passo acima: com ele o
          # vitest trata `--reporter=...` como filtro de arquivo, a suíte sai
          # verde e o resumo nunca é escrito.
          pnpm --filter @mktos/api exec vitest run test/cofre.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$RESUMO_COFRE"
          node -e '
            const fs = require("node:fs");
            let r;
            try { r = JSON.parse(fs.readFileSync(process.env.RESUMO_COFRE, "utf8")); }
            catch (e) { console.log("::error::resumo do cofre ilegivel: " + e.message); process.exit(1); }
            const piso = Number(process.env.PISO_CASOS_COFRE);
            const total = r.numTotalTests;
            console.log("cofre com RLS: " + total + " casos, " + r.numPassedTests + " verdes, " +
              r.numFailedTests + " vermelhos, " + r.numPendingTests + " pulados (piso: " + piso + ").");
            if (r.success !== true || r.numFailedTests > 0 || r.numPendingTests > 0) {
              console.log("::error::a suite do cofre nao passou inteira.");
              process.exit(1);
            }
            if (!Number.isInteger(piso) || total < piso) {
              console.log("::error::so " + total + " casos rodaram, abaixo do piso de " + piso +
                " (esperados 97: 89 sem a secao de isolamento + 8 dela). A secao nao foi registrada — " +
                "quase sempre RLS_NO_TESTE ou TENANT_DATABASE_URL que nao chegou. Ela NAO aparece como " +
                "pulada, porque o arquivo a registra por if; este piso e o que a impede de sumir em silencio. " +
                "Sem ela, NADA mede se uma empresa alcanca o segredo de outra.");
              process.exit(1);
            }
          '

  # ---------------------------------------------------------------------------
  # 3. As migrations aplicam do zero E correspondem ao schema.
  # ---------------------------------------------------------------------------
  #
  # Isto não é zelo: `prisma migrate deploy` roda no `command` do container da
  # api em produção. Migration que falha não deixa a API subir. Este job é o
  # ensaio dessa mesma sequência, do zero, antes do merge.
  #
  # LIMITE DESTE JOB, PARA NINGUÉM LER O VERDE COMO GARANTIA DE PRODUÇÃO:
  # ele aplica num banco VAZIO, que é o caso fácil. Produção aplica sobre banco
  # POVOADO, e é lá que a migration derruba a API — coluna NOT NULL sem default
  # em tabela com linhas, UNIQUE sobre dado já duplicado, tipo que não converte,
  # lock demorado em tabela grande. Verde aqui NÃO prova que aplica em produção;
  # prova que o histórico é coerente e que o SQL cru foi junto. Ensaio contra
  # cópia restaurada do banco de produção continua sendo trabalho manual.
  migrations:
    name: Migrations aplicam do zero
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mkt
          POSTGRES_PASSWORD: mkt
          POSTGRES_DB: marketing_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mkt -d marketing_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://mkt:mkt@localhost:5432/marketing_os_test
      # Banco à parte, só para a comparação migrations x schema: o `migrate
      # diff` RESETA o banco sombra a cada execução, então ele não pode ser o
      # mesmo que acabou de provar que aplica do zero.
      SHADOW_DATABASE_URL: postgresql://mkt:mkt@localhost:5432/marketing_os_shadow

    steps:
      - uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: O banco precisa estar vazio antes de aplicar
        env:
          PGPASSWORD: mkt
        run: |
          n=$(psql -h localhost -U mkt -d marketing_os_test -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          if [ "$n" != "0" ]; then
            echo "::error::o banco da CI não está vazio ($n tabelas) — a prova de aplicar do zero não valeria"
            exit 1
          fi

      - name: prisma migrate deploy
        run: pnpm --filter @mktos/api db:deploy

      - name: prisma migrate status
        run: pnpm --filter @mktos/api db:status

      # As migrations têm SQL cru que o Prisma não modela e que ninguém percebe
      # faltando até produção: a extensão pgvector (busca semântica) e as RULEs
      # que fazem do EventLog um registro append-only de verdade.
      - name: O SQL cru das migrations também aplicou
        env:
          PGPASSWORD: mkt
        run: |
          psql -h localhost -U mkt -d marketing_os_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector') THEN
              RAISE EXCEPTION 'extensão pgvector ausente — a busca semântica não subiria';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_rules WHERE tablename = 'EventLog' AND rulename = 'eventlog_sem_update') THEN
              RAISE EXCEPTION 'RULE eventlog_sem_update ausente — o RASTRO deixaria de ser append-only';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_rules WHERE tablename = 'EventLog' AND rulename = 'eventlog_sem_delete') THEN
              RAISE EXCEPTION 'RULE eventlog_sem_delete ausente — o RASTRO deixaria de ser append-only';
            END IF;
          END
          $$;
          SQL

      - name: Criar o banco sombra da comparação
        env:
          PGPASSWORD: mkt
        run: |
          psql -h localhost -U mkt -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS marketing_os_shadow" \
            -c "CREATE DATABASE marketing_os_shadow"

      # Aplicar não é corresponder. Um model novo no schema.prisma sem a
      # migration correspondente passa nos passos acima — o histórico continua
      # aplicando — e só quebra em runtime, quando o client gerado pede uma
      # coluna que não existe no banco. `migrate diff` replica o histórico no
      # banco sombra e compara com o datamodel: divergência é erro aqui.
      - name: As migrations correspondem ao schema
        run: |
          # `--exit-code` do prisma: 0 = idênticos, 2 = divergem, 1 = não deu
          # para comparar. Os dois últimos reprovam — na dúvida, vermelho.
          codigo=0
          saida="$(pnpm --filter @mktos/api db:diff 2>&1)" || codigo=$?
          echo "$saida"
          if [ "$codigo" = "0" ]; then
            echo "As migrations reproduzem o schema.prisma."
            exit 0
          fi
          if [ "$codigo" = "2" ]; then
            echo "::error title=Migrations divergem do schema::o histórico de migrations não reproduz o schema.prisma. Model alterado sem a migration correspondente aplica verde e quebra em runtime, quando o client gerado pedir a coluna que não existe. Gere a migration com 'pnpm --filter @mktos/api db:migrate --create-only' e confira o SQL antes de commitar."
            echo "--- SQL que faltaria aplicar para o banco alcançar o schema:"
            pnpm --filter @mktos/api db:diff:sql || true
          else
            echo "::error title=Comparação migrations x schema falhou::o prisma saiu com código $codigo e não chegou a comparar (banco sombra fora do ar, schema inválido, migrations ilegíveis). Sem a comparação não dá para afirmar que o histórico corresponde ao schema, então isto reprova em vez de passar."
          fi
          exit 1
