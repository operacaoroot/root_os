# Integração contínua do ROOT OS (RF-T-05, RF-P-08).
#
# Três jobs, nesta ordem de importância:
#   1. qualidade   — typecheck + suítes de policy, web e api, COM banco de verdade.
#   2. isolamento  — a suíte de isolamento entre tenants (fora do `pnpm test`), a
#                    seção de RLS das rotas públicas e a seção de isolamento do
#                    COFRE, mais login/serviços de plataforma. As quatro precisam
#                    do papel restrito e de um banco só
#                    delas, porque ligam RLS no banco inteiro.
#   3. migrations  — o histórico aplica num banco vazio E corresponde ao schema.
#
# ---------------------------------------------------------------------------
# ESTE ARQUIVO, SOZINHO, NÃO REPROVA MERGE NENHUM
# ---------------------------------------------------------------------------
# Workflow relata; quem barra um PR vermelho é a proteção de branch. Enquanto
# os jobs não estiverem marcados como verificação obrigatória em
# `Settings > Branches > branch protection rule` da `main`, um PR com a CI
# inteira vermelha continua com o botão de merge liberado.
#
# Marcar como obrigatórios (os nomes exatos que aparecem na lista de checks do
# PR, que são os `name:` dos jobs):
#   - "Tipos e testes (policy, web, api)"
#   - "Isolamento entre tenants"
#   - "Migrations aplicam do zero"
#
# "Isolamento entre tenants" ENTROU nesta lista na fatia 1.5 (11/09/2026), e a
# entrada dele é a metade que falta de uma coisa só. O `continue-on-error` do
# passo "Suíte de isolamento" foi apagado no mesmo commit que ligou o isolamento
# por linha no banco (migration `20260911050000_isolamento_por_linha`): os dois
# passos do job agora reprovam de verdade, e vermelho ali é vazamento entre
# empresas, não dívida datada.
#
# Enquanto ele não estiver marcado na proteção de branch, o job reprova e o
# botão de merge continua liberado — que é o pior dos dois mundos, porque a
# prova existe e ninguém a obedece. Isso é configuração no GitHub, fora do
# repositório, e só o dono do repo faz.
#
# ---------------------------------------------------------------------------
# A ARMADILHA QUE ESTE ARQUIVO EXISTE PARA NÃO REPETIR
# ---------------------------------------------------------------------------
# `porta.test.ts` e `runtime.test.ts` usam `describe.skipIf(!process.env.TEST_DATABASE_URL)`.
# Sem essa variável eles se pulam INTEIROS e a CI fica verde sem ter testado a
# porta. Por isso o job 1 sobe um Postgres de serviço, aplica as migrations e só
# então roda a suíte.
#
# A trava que confere isso (`$RUNNER_TEMP/conferir-suite.mjs`) é FAIL-CLOSED de
# propósito: ela lê o resumo do vitest em JSON e afirma sobre números — zero
# pulados, zero pendentes, e um PISO de quantidade de casos e de arquivos. Se o
# resumo não existir, vier vazio, não for JSON ou tiver perdido um campo, ela
# REPROVA em vez de supor que está tudo bem. A versão anterior fazia `grep` no
# texto do log: bastava trocar o formato de saída, ou o log não existir, para o
# grep não casar e a CI passar verde com dezenas de casos pulados.
#
# O piso importa mais do que parece: "ninguém marcou skip" não é o mesmo que "os
# testes que importam rodaram". Arquivo que deixa de ser coletado — glob de
# include alterado, `MKTOS_CONJUNTO_DE_TESTES` vazado no ambiente — não aparece
# como pulado, some. Baixar um piso é uma decisão consciente, por escrito, aqui.
#
# O que NÃO está aqui, de propósito:
#   - `pnpm lint`: `apps/web` declara `next lint`, que nunca foi configurado —
#     ele abre o assistente interativo e falha. Entra quando alguém configurar
#     o ESLint do web.
#   - `tenant-isolation` no job 1: precisa de banco semeado com duas orgs E de um
#     papel restrito com senha para medir alguma coisa (dono de tabela ignora
#     policy). Job próprio, abaixo — e desde a fatia 1.5 ele reprova de verdade.

name: CI

on:
  push:
    branches: [main, 'root-os/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # O Dockerfile roda node:22-slim; CI em outra major não prova nada.
  NODE_VERSION: '22'
  #
  # A versão do pnpm NÃO se declara aqui. `pnpm/action-setup` lê o campo
  # `packageManager` do `package.json` da raiz, que é a fonte única — declarar
  # de novo neste arquivo criaria dois lugares para atualizar, e no dia em que
  # um mudasse sem o outro os três jobs morreriam no primeiro passo.
  #
  # Sobre o Postgres de serviço, repetido em cada job porque o contexto `env`
  # NÃO é interpolado dentro de `services:` (o serviço sobe antes do job):
  #   - usuário/senha `mkt`/`mkt` não são segredo — o container nasce e morre
  #     dentro do runner e não é alcançável de fora dele;
  #   - o NOME do banco precisa casar com /test|dev|local|staging|shadow/i.
  #     É a trava de segurança de `tenant-isolation.test.ts`, que ESCREVE no
  #     banco e se recusa a rodar num que não se anuncie como descartável.

jobs:
  conector-local:
    name: Prévia local do conector (sem rede ou banco)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar seleção, limites e falhas com arquivos sintéticos
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools/conector-local -p 'test_*.py' -v

  # ---------------------------------------------------------------------------
  # 1. Tipos e testes de policy, web e api — com banco, senão não testa nada.
  # ---------------------------------------------------------------------------
  qualidade:
    name: Tipos e testes (policy, web, api)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mkt
          POSTGRES_PASSWORD: mkt
          POSTGRES_DB: marketing_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mkt -d marketing_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://mkt:mkt@localhost:5432/marketing_os_test
      TEST_DATABASE_URL: postgresql://mkt:mkt@localhost:5432/marketing_os_test
      # Fixado de propósito: se esta variável vazar com outro valor, o vitest da
      # api troca o conjunto de arquivos e roda só o isolamento. Aqui ela é
      # sempre `padrao`, e o piso de casos abaixo pega qualquer desvio.
      MKTOS_CONJUNTO_DE_TESTES: padrao
      #
      # PISOS — o mínimo que precisa ter rodado para o verde valer alguma coisa.
      # Entre parênteses, a contagem REAL medida na estabilização da onda 5
      # (11/09/2026), rodando as três suítes no Mac contra o Postgres
      # descartável. Os pisos ficam abaixo dela de propósito: piso é chão, não
      # espelho — colar no número exato transforma qualquer teste a mais numa
      # edição obrigatória deste arquivo. Ao remover teste de propósito, baixe o
      # piso no mesmo commit e diga por quê na mensagem.
      #
      # A DIVISÃO DE TRABALHO ENTRE OS DOIS PISOS, que é o que faz a folga caber:
      # quem pega ARQUIVO QUE SUMIU DA COLETA é o piso de ARQUIVOS, e ele é
      # colado no número real. Perder um arquivo inteiro pode custar só 5 casos
      # (é o tamanho do menor arquivo do web hoje), e nenhum piso de casos com
      # folga útil pegaria isso — mas 8 < 9 reprova na hora. O piso de CASOS
      # cuida do outro desvio: a suíte que encolhe por dentro sem perder arquivo.
      #
      # (74) em 2 arquivos: politica 37, sobrescrita 37. A onda 4 DOBROU esta
      # suíte com `test/sobrescrita.test.ts`; o piso de 20 deixaria o arquivo
      # novo inteiro sumir sem uma reclamação.
      #
      # ONDA 10, ESTABILIZAÇÃO (11/09/2026): remedido, 74 em 2 — inalterado. A
      # onda não tocou no motor puro. Os pisos ficam onde estão.
      PISO_CASOS_POLICY: '60'
      PISO_ARQUIVOS_POLICY: '2'
      # (132) em 12 arquivos: blocos 7, busca 15, card 4, cta 2, dados 13,
      # filtros 12, nav 19, regua 14, regua-modulos 12, regua-simulador 24,
      # resgate-central 5, storage 5. O arquivo novo da onda 4
      # (resgate-central) é o MENOR da suíte, com 5 casos — é exatamente o caso
      # que só o piso de ARQUIVOS pega, e foi por ele que o piso foi a 9.
      #
      # ONDA 6, ESTABILIZAÇÃO (11/09/2026): MEDIDO, 142 em 13. A fatia 2.3 trouxe
      # as três telas da Régua (`regua` 14, `regua-modulos` 12, `regua-simulador`
      # 24 = 50 casos), `nav` ganhou um caso (18 → 19), e a estabilização
      # acrescentou `erro-da-api` (10): o código da recusa de conector desligado
      # atravessando o cliente da API até a caixa de erro da tela (RF-G-06).
      # Os dois pisos sobem junto pelo motivo de sempre: em 9, sumirem os quatro
      # arquivos novos não reprovaria nada.
      # 116/142 = 18% de folga, a mesma proporção das ondas anteriores.
      #
      # ONDA 8, ESTABILIZAÇÃO (11/09/2026): MEDIDO, 196 casos em 16 arquivos.
      #   aprovacoes-permissao 16, atendimento 25, blocos 7, busca 15, card 4,
      #   conexoes 13, cta 2, dados 13, erro-da-api 10, filtros 12, nav 19,
      #   regua 14, regua-modulos 12, regua-simulador 24, resgate-central 5,
      #   storage 5.
      #
      # +54 casos e +3 arquivos sobre a onda 6. Os três novos são das duas
      # fatias desta onda: `atendimento` (25) e `aprovacoes-permissao` (16) da
      # fila de aprovação (3.10), `conexoes` (13) do contrato de conector (5.4).
      # Nenhum arquivo antigo encolheu.
      #
      # O piso de ARQUIVOS vai a 16, colado no real — `conexoes` tem 13 casos e
      # `aprovacoes-permissao` 16: nenhum piso de CASOS com folga útil notaria a
      # falta de um deles. O de CASOS vai a 161 (18% de folga sobre 196).
      #
      # ONDA 10, ESTABILIZAÇÃO (11/09/2026): MEDIDO, 228 casos em 17 arquivos.
      #   aprovacoes-permissao 16, atendimento 25, blocos 7, busca 15, card 4,
      #   conexoes 13, contexto-mapa 32, cta 2, dados 13, erro-da-api 10,
      #   filtros 12, nav 19, regua 14, regua-modulos 12, regua-simulador 24,
      #   resgate-central 5, storage 5.
      #
      # +32 casos e +1 arquivo sobre a onda 8, todos da fatia 4.4:
      # `contexto-mapa` mede o mapa que virou a tela principal — inclusive o
      # clique de mouse de verdade, que o ambiente de teste não implementa e que
      # a fatia emulou (captura de ponteiro e classe de evento) para conseguir
      # reintroduzir o defeito e vê-lo vermelho.
      #
      # O piso de ARQUIVOS vai a 17, colado no real. O de CASOS vai a 187 (~18%
      # de folga sobre 228), a mesma proporção de sempre.
      #
      # ONDA 11 (12/09/2026): MEDIDO, 278 casos em 19 arquivos. Os dois arquivos
      # novos são da tela de custo de IA (fatia 6.4): `unit/custo-ia` (36) e
      # `component/custo-ia` (14). O piso de ARQUIVOS vai a 19, colado no real;
      # o de CASOS vai a 227, ~18% de folga sobre 278.
      #
      # ESTEIRA DE CLIENTES (17/09/2026): +16 casos, +2 arquivos, só desta fatia
      # — `unit/horas` (7: formatar e ler hora, idade do cartão, o "hoje" de
      # Brasília) e `component/trabalho-esteira` (9: limite no cabeçalho da
      # coluna, idade e horas no cartão, apontar na gaveta, só o autor apaga,
      # arrastar e soltar, criar pelo modelo). O piso de ARQUIVOS vai a 21; o de
      # CASOS sobe 13 (~18% de folga sobre os 16 novos), para 240.
      PISO_CASOS_WEB: '240'
      PISO_ARQUIVOS_WEB: '21'
      # (388) em 15 arquivos: alcada-reautenticacao 32, arquitetura 21,
      # contexto-aprovacao 10, contexto-execucao 40, env 7, llm-step 10,
      # modelos-globais 20, modulos-por-tenant 97, politica-por-tenant 27,
      # porta 20, provisionamento 40, rotas-publicas-tenant 38, runtime 9,
      # token-de-sessao 8, validacao 9.
      # A onda 2 levou a suíte de 76 para 146, a onda 3 de 146 para 243, a onda 4
      # de 243 para 348 e a onda 5 de 348 para 388, com dois arquivos novos
      # (`alcada-reautenticacao` e `token-de-sessao`, os dois da fatia 3.4).
      #
      # Os dois pisos sobem JUNTO com ela, e é obrigatório que subam: o de
      # ARQUIVOS é colado no número real (15) porque é ele quem pega arquivo que
      # some da coleta — deixá-lo em 13 seria autorizar, por escrito, a perda
      # silenciosa dos dois arquivos novos, e `token-de-sessao` tem 8 casos:
      # nenhum piso de CASOS com folga útil notaria a falta dele. O de CASOS vai
      # para 318 (18% de folga sobre 388), a mesma proporção das ondas
      # anteriores.
      #
      # Os 38 casos de `rotas-publicas-tenant` são os que rodam SEM `RLS_NO_TESTE`.
      # A seção de RLS daquele arquivo (mais 15) não entra nesta conta: ela nem
      # é registrada aqui, porque liga `ROW LEVEL SECURITY` no banco INTEIRO e
      # derrubaria os outros arquivos, que rodam em paralelo contra o mesmo
      # banco. Ela tem passo próprio no job `isolamento`, abaixo.
      # `tenant-isolation.test.ts` também não entra — conjunto `padrao` o
      # exclui, e ele tem job próprio.
      #
      # ---------------------------------------------------------------------
      # ONDA 6, FATIA 3.5 (11/09/2026): +51 casos em +2 arquivos
      # ---------------------------------------------------------------------
      # `rastro-por-nivel` 22 (sem banco) e `rastro-retencao` 29 (com banco,
      # medidos contra o Postgres descartável). A conta vai de 388/15 para
      # 439/17, e o piso de CASOS para 360 — ~18% de folga, a mesma proporção
      # das ondas anteriores.
      #
      # `rastro-retencao` tem uma terceira seção, a do PAPEL RESTRITO (2 casos),
      # que este job não roda: ela entra por `if (URL_RESTRITA)` e não por
      # `describe.skipIf`, justamente para não aparecer como PULADA aqui — a
      # trava abaixo reprova a suíte com qualquer caso pulado, e
      # `TENANT_DATABASE_URL` só existe no job `isolamento`. Mesma solução de
      # `rotas-publicas-tenant`, mesmo motivo.
      #
      # O piso de ARQUIVOS ficou em 17 na fatia 3.5, e não em 19, porque o agente
      # daquela fatia não podia afirmar sobre suíte que não escreveu nem mediu:
      # as fatias 3.6 (`teto-custo-ia.test.ts`) e 3.7 (`conector-desligado.test.ts`)
      # acrescentam um arquivo cada, e ele não as tinha em mãos.
      #
      # ---------------------------------------------------------------------
      # ONDA 6, ESTABILIZAÇÃO (11/09/2026): MEDIDO, 533 casos em 19 arquivos
      # ---------------------------------------------------------------------
      # Contagem real, com `TEST_DATABASE_URL` apontando para o Postgres
      # descartável e nenhum caso pulado — que é o mesmo regime deste job:
      #   alcada-reautenticacao 32, arquitetura 21, conector-desligado 35,
      #   contexto-aprovacao 10, contexto-execucao 40, env 7, llm-step 10,
      #   modelos-globais 20, modulos-por-tenant 97, politica-por-tenant 27,
      #   porta 30, provisionamento 40, rastro-por-nivel 22, rastro-retencao 29,
      #   rotas-publicas-tenant 38, runtime 9, teto-custo-ia 49,
      #   token-de-sessao 8, validacao 9.
      #
      # A conta de 439/17 da fatia 3.5 não contava os dois arquivos das fatias
      # vizinhas (49 + 35 = 84 casos) nem os 10 casos do gancho da porta, que a
      # estabilização acrescentou a `porta.test.ts` (20 → 30).
      #
      # O de ARQUIVOS vai a 19, colado no número real: é ele quem pega arquivo
      # que some da coleta, e `token-de-sessao` (8 casos) prova que nenhum piso
      # de CASOS com folga útil notaria a falta de um arquivo pequeno.
      #
      # ---------------------------------------------------------------------
      # ONDA 6, CORREÇÃO DO GANCHO DA PORTA (11/09/2026): 539 casos, 19 arquivos
      # ---------------------------------------------------------------------
      # Remedida no mesmo regime (banco descartável, nenhum caso pulado) depois
      # da correção do gancho: +6 casos, nenhum arquivo novo.
      #   porta 30 → 35   (o registro de interruptores sem Nest, a sequência da
      #                    ROTA de confirmação, a linha de desfecho da porta com
      #                    aprovador, a fronteira intenção × desfecho e a
      #                    colisão payload × conteudo — dois casos antigos foram
      #                    reescritos, não somados)
      #   conector-desligado 35 → 36  (o alcance medido do interruptor: 17
      #                    capacidades com conector, de 62 no catálogo)
      #
      # Os demais 17 arquivos ficam como estavam:
      #   alcada-reautenticacao 32, arquitetura 21, contexto-aprovacao 10,
      #   contexto-execucao 40, env 7, llm-step 10, modelos-globais 20,
      #   modulos-por-tenant 97, politica-por-tenant 27, provisionamento 40,
      #   rastro-por-nivel 22, rastro-retencao 29, rotas-publicas-tenant 38,
      #   runtime 9, teto-custo-ia 49, token-de-sessao 8, validacao 9.
      #
      # ---------------------------------------------------------------------
      # ONDA 6, ESTABILIZAÇÃO FINAL (11/09/2026): 540 casos, 19 arquivos
      # ---------------------------------------------------------------------
      # Remedida uma última vez, no mesmo regime (banco descartável, nenhum caso
      # pulado), depois de a estabilização acrescentar UM caso a
      # `conector-desligado` (36 → 37): o corpo do 403 leva o código estável
      # `conector_desligado`, que é o que a tela lê para oferecer Conexões em vez
      # de mais uma caixa vermelha genérica.
      #
      # A contagem final, arquivo a arquivo:
      #   alcada-reautenticacao 32, arquitetura 21, conector-desligado 37,
      #   contexto-aprovacao 10, contexto-execucao 40, env 7, llm-step 10,
      #   modelos-globais 20, modulos-por-tenant 97, politica-por-tenant 27,
      #   porta 35, provisionamento 40, rastro-por-nivel 22, rastro-retencao 29,
      #   rotas-publicas-tenant 38, runtime 9, teto-custo-ia 49,
      #   token-de-sessao 8, validacao 9.
      #
      # O piso de CASOS vai a 443 — 18% de folga sobre 540, a mesma proporção de
      # todas as ondas anteriores. O de ARQUIVOS continua em 19, colado no real.
      #
      # ---------------------------------------------------------------------
      # ONDA 7, ESTABILIZAÇÃO (11/09/2026): MEDIDO, 668 casos em 21 arquivos
      # ---------------------------------------------------------------------
      # Mesmo regime: `TEST_DATABASE_URL` no Postgres descartável, conjunto
      # `padrao`, nenhum caso pulado. +128 casos e +2 arquivos sobre a onda 6.
      #
      #   alcada-reautenticacao 32, arquitetura 21, cofre 89,
      #   conector-desligado 37, contexto-aprovacao 10, contexto-execucao 40,
      #   env 7, escritas-pela-porta 37, llm-step 10, modelos-globais 20,
      #   modulos-por-tenant 97, politica-por-tenant 27, porta 35,
      #   provisionamento 40, rastro-por-nivel 22, rastro-retencao 31,
      #   rotas-publicas-tenant 38, runtime 9, teto-custo-ia 49,
      #   token-de-sessao 8, validacao 9.
      #
      # De onde vêm os 128: `cofre` (89) e `escritas-pela-porta` (37) são
      # arquivos NOVOS das duas fatias da onda; `rastro-retencao` foi de 29 para
      # 31 (os dois casos da conferência de conexão do expurgo, que passou a
      # cobrar atravessar o isolamento e não só ser dono da tabela).
      #
      # Os 89 de `cofre` são os que rodam SEM `RLS_NO_TESTE`. A seção de
      # isolamento daquele arquivo (mais 8) não entra nesta conta pelo mesmo
      # motivo de `rotas-publicas-tenant`: ela liga RLS no banco INTEIRO e
      # derrubaria os outros arquivos, que rodam em paralelo. Ela tem passo
      # próprio no job `isolamento`, abaixo.
      #
      # O piso de CASOS vai a 548 — 18% de folga sobre 668, a mesma proporção de
      # todas as ondas anteriores. O de ARQUIVOS vai a 21, colado no real: é ele
      # quem pega arquivo que some da coleta.
      #
      # FORA DESTE JOB, e medidos na mesma sessão para quem for conferir:
      #   · isolamento (`test:isolamento`, job próprio): 267 casos (265 da onda
      #     6 mais os 2 que a tabela `SegredoDeConector` trouxe ao registro de
      #     alvos);
      #   · `rotas-publicas-tenant` com `RLS_NO_TESTE=1` e papel restrito: 53
      #     (os 38 daqui mais os 15 da seção de RLS);
      #   · `cofre` com `RLS_NO_TESTE=1` e papel restrito: 97 (os 89 daqui mais
      #     os 8 da seção de isolamento);
      #   · `rastro-retencao` com papel restrito: 33 (os 31 daqui mais 2).
      #
      # ---------------------------------------------------------------------
      # ONDA 8, ESTABILIZAÇÃO (11/09/2026): MEDIDO, 822 casos em 25 arquivos
      # ---------------------------------------------------------------------
      # Mesmo regime das anteriores: conjunto `padrao`, nenhum caso pulado, com
      # `TEST_DATABASE_URL` no Postgres descartável. +154 casos e +4 arquivos
      # sobre a onda 7, e TODOS os 154 vêm dos quatro arquivos novos — nenhum
      # arquivo antigo encolheu nem cresceu:
      #
      #   adversarial 66            (fatia 3.8)
      #   contrato-de-conector 71   (fatia 5.4)
      #   fila-de-aprovacao 13      (fatia 3.10)
      #   publicar-peca 4           (catraca de dívida declarada — ver abaixo)
      #
      # Os 21 de antes, iguais: alcada-reautenticacao 32, arquitetura 21,
      # cofre 89, conector-desligado 37, contexto-aprovacao 10,
      # contexto-execucao 40, env 7, escritas-pela-porta 37, llm-step 10,
      # modelos-globais 20, modulos-por-tenant 97, politica-por-tenant 27,
      # porta 35, provisionamento 40, rastro-por-nivel 22, rastro-retencao 31,
      # rotas-publicas-tenant 38, runtime 9, teto-custo-ia 49,
      # token-de-sessao 8, validacao 9.
      #
      # `publicar-peca.test.ts` NÃO prova que uma coisa funciona: ele MEDE uma
      # regressão declarada (publicar peça pela tela não funciona para ninguém
      # desde 29/08) e fica VERMELHO no dia do conserto, com a mensagem dizendo
      # o que apagar. É o padrão de dívida declarada da casa. Ele conta para o
      # piso como qualquer outro — o que não se quer é que ele suma da coleta.
      #
      # O piso de ARQUIVOS vai a 25, colado no real. O de CASOS vai a 674 —
      # 18% de folga sobre 822, a mesma proporção de todas as ondas anteriores.
      #
      # FORA DESTE JOB, medidos na mesma sessão (todos INALTERADOS em relação à
      # onda 7 — nenhuma fatia desta onda mexeu nas suítes de isolamento):
