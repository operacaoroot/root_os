      # (`canal-de-aprovacao`, `documentacao`, `rebaixamento-por-erro`,
      # `contexto-mapa` no web), e quem remede o conjunto é a estabilização.
      #
      # ---------------------------------------------------------------------
      # ONDA 10, ESTABILIZAÇÃO (11/09/2026): MEDIDO, 1199 casos em 32 arquivos
      # ---------------------------------------------------------------------
      # Mesmo regime deste job: `TEST_DATABASE_URL` no Postgres descartável,
      # conjunto `padrao`, nenhum caso pulado.
      #
      #   adversarial 66, alcada-reautenticacao 32, arquitetura 40,
      #   canal-de-aprovacao 76, cofre 89, conector-desligado 37,
      #   contexto-aprovacao 10, contexto-execucao 40, contrato-de-conector 71,
      #   documentacao 48, env 7, escritas-pela-porta 37, fila-de-aprovacao 13,
      #   llm-step 10, memoria 40, modelos-globais 20, modulos-por-tenant 97,
