      #
      # O piso de ARQUIVOS vai a 28, colado no real. O de CASOS vai a 820 —
      # 18% de folga sobre 1000, a mesma proporção de todas as ondas anteriores.
      #
      # FORA DESTE JOB, medidos na mesma sessão:
      #   · isolamento (`test:isolamento`, job próprio): 277 casos (267 da onda 7
      #     mais os 10 que as tabelas novas da memória e das rotinas trouxeram ao
      #     registro de alvos — 78 tabelas de empresa, todas com RLS e FORCE);
      #   · `rotas-publicas-tenant` com `RLS_NO_TESTE=1` e papel restrito: 53;
      #   · `cofre` com `RLS_NO_TESTE=1` e papel restrito: 97;
      #   · `rastro-retencao` com papel restrito: 33.
      #
      # ---------------------------------------------------------------------
      # ONDA 10, FATIA 4.3 (11/09/2026): +29 casos em +1 arquivo
      # ---------------------------------------------------------------------
      # `resposta-sem-fonte.test.ts` (29 casos): a declaração de ausência no
      # contexto, a regra do defeito, a catraca que cobra o NOME de
